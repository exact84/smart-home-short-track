<button mat-button type="button" class="close-button" (click)="close()">
  <mat-icon>clear</mat-icon>Add Card
</button>
<h2 mat-dialog-title>Select card layout</h2>

<div class="layout-options">
  <button type="button" class="layout-btn" (click)="close(CardLayout.Horizontal)">
    <img src="img/horizontal.png" alt="Horizontal" />
  </button>

  <button type="button" class="layout-btn" (click)="close(CardLayout.Vertical)">
    <img src="img/vertical.png" alt="Vertical" />
  </button>

  <button type="button" class="layout-btn" (click)="close(CardLayout.SingleDevice)">
    <img src="img/single.png" alt="Single Device" />
  </button>
</div>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Cancel</button>
</mat-dialog-actions>
